<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="PromptCraft — bilingual prompt engineering" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="55%" stop-color="#121a24"/><stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8a33d"/><stop offset="100%" stop-color="#c2703a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="14" fill="url(#bg)"/>
  <g opacity=".07" stroke="#8b96a5" stroke-width="1">
    <path d="M0 85h1200M0 170h1200M0 255h1200"/>
    <path d="M300 0v340M600 0v340M900 0v340"/>
  </g>

  <!-- qvevri mark -->
  <g transform="translate(96 170)">
    <ellipse cx="0" cy="0" rx="52" ry="62" fill="none" stroke="url(#amber)" stroke-width="3"/>
    <path d="M-30 -58 Q0 -72 30 -58" fill="none" stroke="url(#amber)" stroke-width="3" stroke-linecap="round"/>
    <path d="M-38 18 Q0 36 38 18" fill="none" stroke="#e8a33d" stroke-width="2" opacity=".55"/>
    <circle cx="0" cy="34" r="3" fill="#e8a33d" opacity=".8"/>
  </g>

  <text x="196" y="132" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#f0f4f8" letter-spacing="-1">PromptCraft</text>
  <text x="196" y="176" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="23" fill="#e8a33d">პრომპტ-ინჟინერია ორ ენაზე · bilingual prompt engineering</text>
  <text x="196" y="215" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#8b96a5">Not a translated prompt list. A prompt system — a skill that writes prompts, and a library</text>
  <text x="196" y="240" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#8b96a5">where the Georgian half is written from intent, not translated.</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">
    <g transform="translate(196 272)">
      <rect x="0" y="0" width="118" height="34" rx="17" fill="#e8a33d" fill-opacity=".14" stroke="#e8a33d" stroke-opacity=".45"/>
      <text x="59" y="22" text-anchor="middle" fill="#e8a33d">259 prompts</text>
    </g>
    <g transform="translate(326 272)">
      <rect x="0" y="0" width="104" height="34" rx="17" fill="#7ea6d8" fill-opacity=".14" stroke="#7ea6d8" stroke-opacity=".45"/>
      <text x="52" y="22" text-anchor="middle" fill="#7ea6d8">EN + ქარ</text>
    </g>
    <g transform="translate(442 272)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#8fbf8f" fill-opacity=".14" stroke="#8fbf8f" stroke-opacity=".45"/>
      <text x="75" y="22" text-anchor="middle" fill="#8fbf8f">30+ AI tools</text>
    </g>
    <g transform="translate(604 272)">
      <rect x="0" y="0" width="128" height="34" rx="17" fill="#b89ad4" fill-opacity=".14" stroke="#b89ad4" stroke-opacity=".45"/>
      <text x="64" y="22" text-anchor="middle" fill="#b89ad4">CC0 · MIT</text>
    </g>
  </g>

  <g transform="translate(980 96)" opacity=".9">
    <rect x="0" y="0" width="150" height="150" rx="12" fill="#0d1117" stroke="#2a3441"/>
    <text x="16" y="34" font-family="ui-monospace,monospace" font-size="13" fill="#8fbf8f">text</text>
    <text x="118" y="34" font-family="ui-monospace,monospace" font-size="13" fill="#f0f4f8" text-anchor="end">68</text>
    <text x="16" y="62" font-family="ui-monospace,monospace" font-size="13" fill="#e8a33d">image</text>
    <text x="118" y="62" font-family="ui-monospace,monospace" font-size="13" fill="#f0f4f8" text-anchor="end">85</text>
    <text x="16" y="90" font-family="ui-monospace,monospace" font-size="13" fill="#7ea6d8">code</text>
    <text x="118" y="90" font-family="ui-monospace,monospace" font-size="13" fill="#f0f4f8" text-anchor="end">44</text>
    <text x="16" y="118" font-family="ui-monospace,monospace" font-size="13" fill="#b89ad4">video</text>
    <text x="118" y="118" font-family="ui-monospace,monospace" font-size="13" fill="#f0f4f8" text-anchor="end">38</text>
    <text x="16" y="140" font-family="ui-monospace,monospace" font-size="12" fill="#8b96a5">audio · agents</text>
    <text x="134" y="140" font-family="ui-monospace,monospace" font-size="12" fill="#8b96a5" text-anchor="end">24</text>
  </g>
</svg>
