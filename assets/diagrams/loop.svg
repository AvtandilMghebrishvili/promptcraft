<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="The engineering loop, one prompt per stage" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="250" rx="12" fill="#0d1117"/>
  <text x="32" y="42" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#f0f4f8">One prompt per stage — so no single context carries every perspective</text>
  <text x="32" y="66" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#8b96a5">თითო ეტაპი ცალკე პრომპტში — რომ ერთ კონტექსტში ყველა პერსპექტივა არ აირიოს</text>

  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">
    <g transform="translate(32 110)"><rect width="140" height="62" rx="9" fill="#121a24" stroke="#7ea6d8" stroke-opacity=".55"/><text x="70" y="27" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f4f8">plan</text><text x="70" y="46" text-anchor="middle" fill="#8b96a5">no code</text></g>
    <g transform="translate(196 110)"><rect width="140" height="62" rx="9" fill="#121a24" stroke="#7ea6d8" stroke-opacity=".55"/><text x="70" y="27" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f4f8">test</text><text x="70" y="46" text-anchor="middle" fill="#8b96a5">failing first</text></g>
    <g transform="translate(360 110)"><rect width="140" height="62" rx="9" fill="#121a24" stroke="#8fbf8f" stroke-opacity=".55"/><text x="70" y="27" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f4f8">implement</text><text x="70" y="46" text-anchor="middle" fill="#8b96a5">scoped + stop</text></g>
    <g transform="translate(524 110)"><rect width="140" height="62" rx="9" fill="#121a24" stroke="#e8a33d" stroke-opacity=".55"/><text x="70" y="27" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f4f8">review</text><text x="70" y="46" text-anchor="middle" fill="#8b96a5">fresh context</text></g>
    <g transform="translate(688 110)"><rect width="140" height="62" rx="9" fill="#121a24" stroke="#e8a33d" stroke-opacity=".55"/><text x="70" y="27" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f4f8">verify</text><text x="70" y="46" text-anchor="middle" fill="#8b96a5">run it, don't infer</text></g>
    <g transform="translate(852 110)"><rect width="140" height="62" rx="9" fill="#121a24" stroke="#b89ad4" stroke-opacity=".55"/><text x="70" y="27" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f4f8">remember</text><text x="70" y="46" text-anchor="middle" fill="#8b96a5">into the rules file</text></g>
    <g transform="translate(1016 110)"><rect width="152" height="62" rx="9" fill="#121a24" stroke="#b89ad4" stroke-opacity=".55"/><text x="76" y="27" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f4f8">improve</text><text x="76" y="46" text-anchor="middle" fill="#8b96a5">kill the repeat</text></g>
  </g>

  <g stroke="#3a4654" stroke-width="2" fill="none">
    <path d="M178 141h12" marker-end="url(#b)"/><path d="M342 141h12" marker-end="url(#b)"/>
    <path d="M506 141h12" marker-end="url(#b)"/><path d="M670 141h12" marker-end="url(#b)"/>
    <path d="M834 141h12" marker-end="url(#b)"/><path d="M998 141h12" marker-end="url(#b)"/>
  </g>
  <path d="M1092 178 V206 H102 V178" stroke="#3a4654" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#b)"/>
  <defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3a4654"/></marker></defs>
</svg>
